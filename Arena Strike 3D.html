<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arena Strike 3D</title>
<style>
:root{--card:#fff;--text:#1d2530;--accent:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#1b2129;--text:#e8edf2;color-scheme:dark}}
:root[data-theme="dark"]{--card:#1b2129;--text:#e8edf2;color-scheme:dark}
html,body{height:100%;margin:0;background:#7aa0c4;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none}
#game{position:relative;width:100%;height:100%}
canvas{display:block}
.chip{position:absolute;background:rgba(0,0,0,.55);color:#fff;padding:6px 12px;border-radius:10px;font-weight:600;pointer-events:none}
#info{top:10px;left:10px}#ammo{bottom:14px;right:14px;font-size:1.3rem}
#hpw{position:absolute;bottom:14px;left:14px;width:200px;height:16px;background:rgba(0,0,0,.55);border-radius:8px;overflow:hidden;pointer-events:none}
#hp{height:100%;width:100%;background:#3ecf8e;transition:width .15s}
.cross{position:absolute;top:50%;left:50%;width:20px;height:20px;margin:-10px 0 0 -10px;pointer-events:none}
.cross:before,.cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
.cross:before{left:9px;top:0;width:2px;height:20px;clip-path:polygon(0 0,100% 0,100% 35%,0 35%,0 65%,100% 65%,100% 100%,0 100%)}
.cross:after{top:9px;left:0;height:2px;width:20px;clip-path:polygon(0 0,35% 0,35% 100%,0 100%,65% 0,100% 0,100% 100%,65% 100%)}
#dmg{position:absolute;inset:0;background:radial-gradient(transparent 40%,rgba(200,0,0,.8));opacity:0;pointer-events:none}
#hit{position:absolute;top:50%;left:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border:2px solid #ff4d4d;border-radius:50%;opacity:0;pointer-events:none}
.over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
.over[hidden]{display:none}
.card{background:var(--card);color:var(--text);padding:22px 26px;border-radius:16px;text-align:center;max-width:340px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.card h1{margin:0 0 8px;font-size:1.5rem}.card p{margin:6px 0;font-size:.95rem;opacity:.85}
.card button{margin-top:10px;font:inherit;font-weight:600;border:0;border-radius:10px;background:var(--accent);color:#fff;padding:10px 26px;cursor:pointer}
</style>
</head>
<body>
<div id="game">
  <div id="dmg"></div><div class="cross"></div><div id="hit"></div>
  <div class="chip" id="info">Волна 1 · Очки 0</div>
  <div id="hpw"><div id="hp"></div></div>
  <div class="chip" id="ammo">30 / 30</div>
  <div class="over" id="over"><div class="card"><h1>🎯 Arena Strike 3D</h1><p id="msg">Отбивайтесь от волн врагов на арене. Выстрел в голову убивает сразу.</p><p>WASD — движение · Shift — бег<br>Мышь — прицел · ЛКМ — огонь · R — перезарядка</p><p id="note" style="font-size:.8rem"></p><button id="go">Начать</button></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var $=function(id){return document.getElementById(id)},box=$('game'),keys={},best=0,AC=null;
try{best=+localStorage.getItem('arena-best')||0}catch(e){}
var R=new THREE.WebGLRenderer({antialias:true});box.insertBefore(R.domElement,box.firstChild);
R.setPixelRatio(Math.min(devicePixelRatio,2));
var S=new THREE.Scene();S.background=new THREE.Color(0x7aa0c4);S.fog=new THREE.Fog(0x7aa0c4,40,130);
var cam=new THREE.PerspectiveCamera(75,1,0.1,300);cam.rotation.order='YXZ';S.add(cam);
S.add(new THREE.HemisphereLight(0xffffff,0x4a5040,1));
var sun=new THREE.DirectionalLight(0xfff0d0,0.6);sun.position.set(30,60,20);S.add(sun);
function mat(c){return new THREE.MeshLambertMaterial({color:c})}
function add(w,h,d,c,x,y,z,p){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);(p||S).add(m);return m}
var gr=new THREE.Mesh(new THREE.PlaneGeometry(130,130),mat(0x59624f));gr.rotation.x=-Math.PI/2;S.add(gr);
var gh=new THREE.GridHelper(116,29,0x000000,0x000000);gh.position.y=0.02;gh.material.transparent=true;gh.material.opacity=0.15;S.add(gh);
var AR=58,covers=[],boxes=[];
function crate(w,h,d,x,z,c){var m=add(w,h,d,c,x,h/2,z);covers.push(m);boxes.push([x-w/2,x+w/2,z-d/2,z+d/2])}
crate(2*AR+2,8,2,0,-AR-1,0x3b4048);crate(2*AR+2,8,2,0,AR+1,0x3b4048);crate(2,8,2*AR+2,-AR-1,0,0x3b4048);crate(2,8,2*AR+2,AR+1,0,0x3b4048);
var pal=[0x8a6d3b,0x6f7d5a,0x7d7f86,0x9a5b3c];
for(var i=0;i<18;i++){var cx=(Math.random()*2-1)*48,cz=(Math.random()*2-1)*48;if(Math.hypot(cx,cz)<10){i--;continue}
  crate(3+Math.random()*4,1.6+Math.random()*2.6,3+Math.random()*4,cx,cz,pal[i%4])}
function resolve(p,r){
  for(var k=0;k<boxes.length;k++){var q=boxes[k],qx=Math.max(q[0],Math.min(p.x,q[1])),qz=Math.max(q[2],Math.min(p.z,q[3])),dx=p.x-qx,dz=p.z-qz,d=Math.hypot(dx,dz);
    if(d<r&&d>0.001){p.x=qx+dx/d*r;p.z=qz+dz/d*r}}
}
var gun=new THREE.Group();add(0.12,0.16,0.7,0x2a2d33,0,0,0,gun);add(0.08,0.08,0.3,0x15171a,0,0.03,-0.45,gun);
var flash=add(0.2,0.2,0.1,0xffe27a,0,0.03,-0.65,gun);flash.visible=false;gun.position.set(0.28,-0.26,-0.55);cam.add(gun);
var P={x:0,z:8},yaw=0,pitch=0,hp=100,ammo=30,reload=0,cd=0,score=0,wave=0,wwait=1,enemies=[],mode='menu',down=false,locked=false,noLock=false,rdown=false,kick=0,dmgA=0,hitA=0;
function beep(f,d,t,v){if(!AC)return;var o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(40,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(0.001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}
function spawnEnemy(){
  var a=Math.random()*6.283,r=30+Math.random()*18,x=Math.max(-54,Math.min(54,P.x+Math.sin(a)*r)),z=Math.max(-54,Math.min(54,P.z+Math.cos(a)*r));
  var g=new THREE.Group(),bm=mat(0x7b2d26);
  var body=new THREE.Mesh(new THREE.BoxGeometry(0.9,1.2,0.5),bm);body.position.y=1.2;
  var head=add(0.45,0.45,0.45,0xd9b38c,0,2.0,0,g),legs=add(0.7,0.8,0.4,0x22252a,0,0.4,0,g);add(0.1,0.1,0.6,0x15171a,0.5,1.3,0.4,g);
  g.add(body);body.userData={};head.userData={head:true};
  var e={g:g,hp:100,body:body,head:head,legs:legs,fire:1+Math.random(),fl:0};body.userData.e=e;head.userData.e=e;legs.userData.e=e;
  g.position.set(x,0,z);S.add(g);enemies.push(e);
}
function reset(){P.x=0;P.z=8;yaw=0;pitch=0;hp=100;ammo=30;reload=0;score=0;wave=0;wwait=1;enemies.forEach(function(e){S.remove(e.g)});enemies=[]}
var rc=new THREE.Raycaster(),rc2=new THREE.Raycaster(),ctr=new THREE.Vector2(0,0);
function shoot(){
  ammo--;cd=0.1;kick=1;flash.visible=true;beep(260,0.12,'sawtooth',0.12);
  var t=covers.slice();enemies.forEach(function(e){t.push(e.body,e.head,e.legs)});
  rc.setFromCamera(ctr,cam);var h=rc.intersectObjects(t,false);
  if(h.length&&h[0].object.userData.e){
    var e=h[0].object.userData.e,hd=h[0].object.userData.head;e.hp-=hd?100:34;e.fl=0.08;e.body.material.emissive.setHex(0xff0000);hitA=1;beep(700,0.05,'square',0.08);
    if(e.hp<=0){S.remove(e.g);enemies.splice(enemies.indexOf(e),1);score+=hd?150:100;hp=Math.min(100,hp+15)}
  }
  if(ammo<=0)reload=1.4;
}
function die(){
  mode='dead';if(document.exitPointerLock)document.exitPointerLock();
  if(score>best){best=score;try{localStorage.setItem('arena-best',String(best))}catch(e){}}
  $('msg').textContent='Вы погибли на волне '+wave+'. Очки: '+score+' · Рекорд: '+best;$('go').textContent='Ещё раз';$('over').hidden=false;
}
function lock(){try{R.domElement.requestPointerLock()}catch(e){noLock=true}}
$('go').onclick=function(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(mode==='menu'||mode==='dead')reset();
  mode='play';$('over').hidden=true;lock();
};
document.addEventListener('pointerlockchange',function(){
  locked=document.pointerLockElement===R.domElement;
  if(!locked&&mode==='play'&&!noLock){mode='pause';$('msg').textContent='Пауза';$('go').textContent='Продолжить';$('over').hidden=false}
});
document.addEventListener('pointerlockerror',function(){noLock=true;$('note').textContent='Захват курсора недоступен: поворот — правая кнопка мыши. Откройте игру в отдельной вкладке для полного эффекта.'});
addEventListener('mousemove',function(e){
  if(mode!=='play'||!(locked||(noLock&&rdown)))return;
  yaw-=e.movementX*0.0022;pitch=Math.max(-1.4,Math.min(1.4,pitch-e.movementY*0.0022));
});
addEventListener('mousedown',function(e){if(e.button===0)down=true;if(e.button===2)rdown=true});
addEventListener('mouseup',function(e){if(e.button===0)down=false;if(e.button===2)rdown=false});
addEventListener('contextmenu',function(e){e.preventDefault()});
addEventListener('keydown',function(e){keys[e.code]=true;if(e.code==='KeyR'&&mode==='play'&&!reload&&ammo<30)reload=1.4});
addEventListener('keyup',function(e){keys[e.code]=false});
function resize(){var w=box.clientWidth,h=box.clientHeight;R.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
function step(dt){
  var f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0),l=Math.hypot(f,s)||1,sp=(keys.ShiftLeft?12:8)*dt;
  P.x+=(-Math.sin(yaw)*f+Math.cos(yaw)*s)/l*sp;P.z+=(-Math.cos(yaw)*f-Math.sin(yaw)*s)/l*sp;resolve(P,0.5);
  cd-=dt;if(reload>0){reload-=dt;if(reload<=0){reload=0;ammo=30}}
  if(down&&cd<=0&&!reload&&ammo>0)shoot();
  if(!enemies.length){if(wwait>0){wwait-=dt;if(wwait<=0){wave++;var n=Math.min(16,3+wave*2);for(var i=0;i<n;i++)spawnEnemy();wwait=-1}}else if(wwait<0)wwait=2.5}
  enemies.forEach(function(e){
    var p=e.g.position,dx=P.x-p.x,dz=P.z-p.z,d=Math.hypot(dx,dz);
    e.g.rotation.y=Math.atan2(dx,dz);
    if(d>14){p.x+=dx/d*(3.5+wave*0.3)*dt;p.z+=dz/d*(3.5+wave*0.3)*dt;resolve(p,0.7)}
    if(e.fl>0){e.fl-=dt;if(e.fl<=0)e.body.material.emissive.setHex(0)}
    e.fire-=dt;
    if(e.fire<=0&&d<45){
      e.fire=1.1+Math.random()*0.8;
      rc2.set(new THREE.Vector3(p.x,1.5,p.z),new THREE.Vector3(dx,0,dz).normalize());rc2.far=d;
      if(!rc2.intersectObjects(covers,false).length&&Math.random()<0.55){hp-=6+Math.min(wave,6);dmgA=0.8;beep(120,0.15,'square',0.1);if(hp<=0)die()}
    }
  });
}
var last=0;
function loop(t){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(t-last)/1000||0);last=t;
  if(mode==='play')step(dt);
  cam.position.set(P.x,1.7,P.z);cam.rotation.set(pitch,yaw,0);
  kick=Math.max(0,kick-dt*10);gun.position.z=-0.55+kick*0.08;if(kick<0.6)flash.visible=false;
  dmgA=Math.max(0,dmgA-dt*1.5);hitA=Math.max(0,hitA-dt*5);
  $('dmg').style.opacity=dmgA;$('hit').style.opacity=hitA;
  $('hp').style.width=Math.max(0,hp)+'%';
  $('ammo').textContent=reload?'Перезарядка…':ammo+' / 30';
  $('info').textContent='Волна '+Math.max(1,wave)+' · Очки '+score+' · Врагов '+enemies.length;
  R.render(S,cam);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
